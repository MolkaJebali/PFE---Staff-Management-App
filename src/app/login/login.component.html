<div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8 bg-white">
 <br> <div class="sm:mx-auto sm:w-full sm:max-w-sm p-8 rounded-xl shadow-sm border border-gray-100">
    <img class="mx-auto h-20 w-auto" src="/Images/Logo%20Biware.png" alt="Your Company">
    <h2 class="mt-6 text-center text-3xl font-bold tracking-tight text-orange-600">Welcome back</h2>
    <p class="mt-2 text-center text-sm text-gray-600">Please enter your credentials</p>

    <div class="mt-8">
      <form class="space-y-5" action="#" method="POST" [formGroup]="loginForm" (ngSubmit)="onLogin()">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Email address</label>
          <div class="mt-1">
            <input type="email" name="email" id="email" formControlName="email" autocomplete="email" required 
                   class="block w-full rounded-md border-0 py-1.5 px-3 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-orange-500 sm:text-sm">
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between">
            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
            <div class="text-sm">
              <a href="#" class="font-semibold text-orange-600 hover:text-orange-500 transition-colors">Forgot password?</a>
            </div>
          </div>
          <div class="mt-1">
            <input type="password" name="password" formControlName="password" id="password" autocomplete="current-password" required 
                   class="block w-full rounded-md border-0 py-1.5 px-3 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-orange-500 sm:text-sm">
          </div>
        </div>

        <div>
          <button type="submit" 
                  class="flex w-full justify-center rounded-md bg-orange-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-orange-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-orange-600 transition-colors duration-200">
            Sign in
          </button>
        </div>
      </form>

      <div class="mt-6 text-center text-sm text-gray-600">
        Not registered yet? <a href="/signin" class="font-semibold text-orange-600 hover:text-orange-500 transition-colors">Create account</a>
      </div>
    </div>
  </div>
</div>
