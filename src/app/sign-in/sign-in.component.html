<div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8 bg-white">
  <div class="sm:mx-auto sm:w-full sm:max-w-2xl bg-white p-8 rounded-xl shadow-sm border border-gray-100">
    <div class="text-center">
      <img class="mx-auto h-20 w-auto" src="/Images/Logo%20Biware.png" alt="Company Logo">
      <h2 class="mt-6 text-2xl font-bold tracking-tight text-orange-600">Create your account</h2>
    </div>

    <form class="mt-8 space-y-6" [formGroup]="signInForm" (ngSubmit)="onSubmit()">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label for="first_name" class="block text-sm font-medium text-gray-700">First name</label>
          <input type="text" formControlName="firstname" id="first_name" placeholder="John" required
                 class="mt-1 block w-full rounded-md border-0 py-1.5 px-3 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-orange-500 sm:text-sm">
        </div>
        
        <div>
          <label for="last_name" class="block text-sm font-medium text-gray-700">Last name</label>
          <input type="text" id="last_name" formControlName="lastname" placeholder="Doe" required
                 class="mt-1 block w-full rounded-md border-0 py-1.5 px-3 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-orange-500 sm:text-sm">
        </div>
        
        <div>
          <label for="phone" class="block text-sm font-medium text-gray-700">Phone number</label>
          <input type="tel" id="phone" formControlName="phone" placeholder="12345678" pattern="[0-9]{8}" required
                 class="mt-1 block w-full rounded-md border-0 py-1.5 px-3 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-orange-500 sm:text-sm">
        </div>
        
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Email address</label>
          <input type="email" id="email" formControlName="email" placeholder="john.doe@company.com" required
                 class="mt-1 block w-full rounded-md border-0 py-1.5 px-3 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-orange-500 sm:text-sm">
        </div>
      </div>

      <div class="bg-orange-50 p-4 rounded-lg space-y-4">
        <div>
          <label for="password" class="block text-sm font-medium text-orange-800">Password</label>
          <input type="password" id="password" formControlName="password" placeholder="•••••••••" required
                 class="mt-1 block w-full rounded-md border-0 py-1.5 px-3 text-gray-900 shadow-sm ring-1 ring-inset ring-orange-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-orange-500 sm:text-sm border-l-4 border-orange-500">
        </div>
        
        <div>
          <label for="confirm_password" class="block text-sm font-medium text-orange-800">Confirm password</label>
          <input type="password" id="confirm_password" placeholder="•••••••••" required
                 class="mt-1 block w-full rounded-md border-0 py-1.5 px-3 text-gray-900 shadow-sm ring-1 ring-inset ring-orange-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-orange-500 sm:text-sm border-l-4 border-orange-500">
        </div>
      </div>

      <div>
        <label for="code" class="block text-sm font-medium text-gray-700">Registration code</label>
        <input type="text" id="code" formControlName="code" placeholder="Enter your registration code" required
               class="mt-1 block w-full rounded-md border-0 py-1.5 px-3 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-orange-500 sm:text-sm">
      </div>

      <div>
        <button type="submit"
                class="flex w-full justify-center rounded-md bg-[#8B4513] px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-[#A0522D] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#8B4513] transition-colors duration-200">
          Sign Up
        </button>
      </div>

      <div class="text-center text-sm text-gray-600">
        Do you already have an account? <a href="http://localhost:4200/" class="font-medium text-orange-600 hover:text-orange-500">Login</a>
      </div>
    </form>
  </div>
</div>
