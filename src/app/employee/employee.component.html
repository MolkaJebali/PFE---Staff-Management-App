<div class="min-h-screen bg-gradient-to-br from-white to-orange-50 flex flex-col">
    <!-- Header fixe et plus large -->
    <header class="bg-white shadow-sm py-4 px-6 sticky top-0 z-50 w-full">
      <div class="max-w-8xl mx-auto flex justify-between items-center">
        <!-- Logo Biware à gauche -->
        <div class="flex items-center">
          <img src="Images/Logo Biware.png" alt="Logo Biware" class="h-14">
        </div>
        
        <!-- Titre au centre avec nouvelle icône "checklist" -->
        <h1 class="text-2xl font-bold text-gray-800">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-amber-600 inline-block mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
          </svg>
          Suivi de mes tâches
        </h1>
        
        <!-- Bouton Retour à l'accueil -->
        <div>
          <a href="/employee-home" class="flex items-center gap-2 bg-orange-100 hover:bg-orange-200 text-orange-700 font-medium px-4 py-2 rounded-lg transition-all duration-200">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Retour à l'accueil
          </a>
        </div>
      </div>
    </header>
  
    <!-- Main Content -->
    <main class="flex-grow p-6 mt-16">
      <div class="max-w-7xl mx-auto bg-white shadow-xl rounded-3xl p-8">
        <div class="flex items-center justify-between mb-8">
          <!-- Nouvelle icône "calendrier avec horloge" -->
          <h1 class="text-3xl font-bold text-amber-700 font-sans">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 inline-block mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span class="border-b border-gray-300 pb-1 text-gray-700">Feuille de Temps Hebdomadaire</span>
          </h1>
          
          <!-- Bouton Export Excel -->
          <button
            type="button"
            (click)="exportToExcel()"
            class="flex items-center gap-2 bg-amber-700 hover:bg-amber-800 text-white px-5 py-2.5 rounded-lg transition-all duration-200 shadow-md hover:shadow-amber-200"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            Exporter Excel
          </button>
        </div>
  
  
        <form [formGroup]="timesheetForm">
            <table class="w-full border-collapse rounded-lg overflow-hidden shadow-sm">
                <thead class="bg-orange-100 text-orange-800 font-medium">
                    <tr>
                        <th class="p-3 border-b-2 border-orange-200 text-left">Team Member</th>
                        <th class="p-3 border-b-2 border-orange-200 text-left">Projet</th>
                        <th class="p-3 border-b-2 border-orange-200 text-left">Tâche</th>
                        <th class="p-3 border-b-2 border-orange-200 text-left">Type de tâche</th>
                        <th class="p-3 border-b-2 border-orange-200 text-left">Date</th>
                        <th class="p-3 border-b-2 border-orange-200 text-left">Heures</th>
                        <th class="p-3 border-b-2 border-orange-200 text-left">Commentaire</th>
                        <th class="p-3 border-b-2 border-orange-200 text-center">Action</th>
                    </tr>
                </thead>
                <tbody formArrayName="rows" class="divide-y divide-orange-100">
                    <tr *ngFor="let row of rows.controls; let i = index" [formGroupName]="i" class="bg-white hover:bg-orange-50 transition-colors duration-150">
                        <td class="p-3 border-b border-orange-100">
                            <input formControlName="teamMember" class="w-full border border-gray-200 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-300 focus:border-transparent" placeholder="Nom" />
                        </td>
                        <td class="p-3 border-b border-orange-100">
                            <input formControlName="project" class="w-full border border-gray-200 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-300 focus:border-transparent" placeholder="Ex: Projet A" />
                        </td>
                        <td class="p-3 border-b border-orange-100">
                            <input formControlName="task" class="w-full border border-gray-200 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-300 focus:border-transparent" placeholder="Ex: Tâche X" />
                        </td>
                        <td class="p-3 border-b border-orange-100">
                            <select formControlName="taskType" class="w-full border border-gray-200 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-300 focus:border-transparent bg-white">
                                <option value="" disabled selected>Sélectionner</option>
                                <option value="Développement">Développement</option>
                                <option value="Test">Test</option>
                                <option value="Analyse">Analyse</option>
                                <option value="Réunion">Réunion</option>
                                <option value="Documentation">Documentation</option>
                                <option value="Formation">Formation</option>
                            </select>
                        </td>
                        <td class="p-3 border-b border-orange-100">
                            <input type="date" formControlName="date" class="w-full border border-gray-200 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-300 focus:border-transparent" />
                        </td>
                        <td class="p-3 border-b border-orange-100">
                            <input type="number" min="0" formControlName="effort" class="w-full border border-gray-200 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-300 focus:border-transparent" (input)="getTotalEffort()" />
                        </td>
                        <td class="p-3 border-b border-orange-100">
                            <input formControlName="comment" class="w-full border border-gray-200 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-300 focus:border-transparent" placeholder="Optionnel" />
                        </td>
                        <td class="p-3 border-b border-orange-100 text-center">
                            <button type="button" (click)="removeRow(i)" class="text-red-500 hover:text-red-700 transition-colors p-1 rounded-full hover:bg-red-50">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
  
            <div class="mt-6 flex justify-between items-center">
                <button
                    type="button"
                    (click)="addRow()"
                    class="flex items-center gap-2 bg-orange-100 hover:bg-orange-200 text-orange-700 font-medium px-4 py-2.5 rounded-lg transition-all duration-200 shadow-sm"
                >
                    <span class="text-lg">+</span>
                    Ajouter une ligne
                </button>
                
                <div class="text-xl font-semibold text-gray-700">
                    Total: <span class="text-orange-600 font-bold">{{ getTotalEffort() }}</span>
                </div>
                
                <button
                    type="button"
                    (click)="submitTimesheet()"
                    class="flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white px-5 py-2.5 rounded-lg transition-all duration-200 shadow-md hover:shadow-green-200"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    Soumettre
                </button>
            </div>
        </form>
      </div>
    </main>
  
    <!-- Footer -->
    <footer class="bg-white py-6 px-6 border-t border-gray-100">
      <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center">
        <div class="text-gray-500 text-sm mb-4 md:mb-0">
          © 2025 Biware Consulting. Tous droits réservés.
        </div>
        <div class="flex space-x-6">
          <a href="#" class="text-gray-500 hover:text-orange-500 transition-colors text-sm">Conditions d'utilisation</a>
          <a href="#" class="text-gray-500 hover:text-orange-500 transition-colors text-sm">Politique de confidentialité</a>
          <a href="#" class="text-gray-500 hover:text-orange-500 transition-colors text-sm">Aide</a>
          <a href="#" class="text-gray-500 hover:text-orange-500 transition-colors text-sm">Contact</a>
        </div>
      </div>
    </footer>
  </div>
