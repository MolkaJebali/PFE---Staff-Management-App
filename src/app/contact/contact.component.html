<div class="contact-container">
    <div class="contact-card">
      <div class="contact-header">
        <h2>Contactez-nous</h2>
        <p class="subtitle">Notre équipe répond sous 24 heures</p>
      </div>
  
      <div class="contact-content">
        <div class="contact-methods">
          <!-- Email -->
          <div class="method">
            <div class="method-icon">
              <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
            </div>
            <div class="method-info">
              <h3>Email</h3>
              <p>contactbiware.com</p>
            </div>
          </div>
  
          <!-- Téléphone -->
          <div class="method">
            <div class="method-icon">
              <svg viewBox="0 0 24 24"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/></svg>
            </div>
            <div class="method-info">
              <h3>Téléphone</h3>
              <p>+216 70 000 000</p>
            </div>
          </div>
        </div>
  
        <!-- Formulaire -->
        <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label>Votre email</label>
            <input type="email" formControlName="email" placeholder="exemple@email.com">
          </div>
  
          <div class="form-group">
            <label>Votre message</label>
            <textarea formControlName="message" rows="4" placeholder="Comment pouvons-nous vous aider ?"></textarea>
          </div>
  
          <button type="submit" [disabled]="contactForm.invalid">
            Envoyer le message
          </button>
        </form>
      </div>
    </div>
  </div>
